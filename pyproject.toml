[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahmed-open-source-toolkit"
version = "0.1.0"
description = "A tiny CLI for checking open-source repository essentials."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed HU YAR" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oss-check = "oss_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
